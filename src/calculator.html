<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器 - 前后端分离</title>
<style>
:root {
  --bg: #fff;
  --card-bg: #4a6cf7;
  --text: #fff;
  --btn-bg: rgba(255,255,255,0.15);
  --btn-hover: rgba(255,255,255,0.3);
  --btn-border: #fff;
  --result-bg: #fff;
  --result-text: #1a1a2e;
}
body.dark {
  --bg: #1a1a2e;
  --card-bg: #16213e;
  --text: #e0e0e0;
  --btn-bg: rgba(255,255,255,0.08);
  --btn-hover: rgba(255,255,255,0.18);
  --btn-border: #555;
  --result-bg: #0f0f1a;
  --result-text: #fff;
}
body {
  margin: 0;
  padding: 40px 20px;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  transition: background 0.3s;
}
.card {
  background: var(--card-bg);
  color: var(--text);
  border-radius: 16px;
  padding: 32px;
  text-align: center;
  max-width: 560px;
  width: 100%;
  transition: background 0.3s, color 0.3s;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.header h1 {
  margin: 0;
}
#themeBtn {
  padding: 8px 14px;
  font-size: 14px;
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  background: var(--btn-bg);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}
#themeBtn:hover {
  background: var(--btn-hover);
}
.keypad {
  display: inline-grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 16px auto;
  width: 100%;
  max-width: 420px;
}
.keypad button {
  padding: 22px 0;
  font-size: 24px;
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  background: var(--btn-bg);
  color: var(--text);
  cursor: pointer;
  width: 100%;
  transition: background 0.2s;
}
.keypad button:hover {
  background: var(--btn-hover);
}
.row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
}
.row button {
  padding: 10px 16px;
  font-size: 16px;
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  background: var(--btn-bg);
  color: var(--text);
  cursor: pointer;
  transition: background 0.2s;
}
.row button:hover {
  background: var(--btn-hover);
}
.result-box {
  background: var(--result-bg);
  color: var(--result-text);
  border-radius: 10px;
  padding: 16px;
  margin: 16px auto;
  max-width: 420px;
  font-size: 22px;
  font-weight: 700;
  min-height: 28px;
  text-align: center;
  transition: background 0.3s, color 0.3s;
}
.pagination {
  margin: 12px 0;
}
.pagination button {
  padding: 6px 14px;
  font-size: 14px;
  border: 1px solid var(--btn-border);
  border-radius: 6px;
  background: var(--btn-bg);
  color: var(--text);
  cursor: pointer;
  margin: 0 4px;
}
.pagination button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>计算器</h1>
    <button onclick="toggleTheme()" id="themeBtn">🌙 切换主题</button>
  </div>

  <div>
    <input type="text" id="expression" placeholder="输入表达式，如 (1+2)*3" autocomplete="off">
    <button id="calcBtn">计算</button>
  </div>

  <div class="row">
    <button onclick="append('+')">+</button>
    <button onclick="append('-')">−</button>
    <button onclick="append('*')">×</button>
    <button onclick="append('/')">÷</button>
  </div>

  <div class="row">
    <button onclick="appendFunc('sin(')">sin</button>
    <button onclick="appendFunc('cos(')">cos</button>
    <button onclick="appendFunc('tan(')">tan</button>
    <button onclick="appendFunc('sqrt(')">√</button>
    <button onclick="appendFunc('log(')">log</button>
    <button onclick="append('pi')">π</button>
    <button onclick="append('e')">e</button>
  </div>

  <div class="keypad">
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('.')">.</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('(')">(</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append(')')">)</button>

    <button onclick="append('0')">0</button>
    <button onclick="clearInput()">C</button>
  </div>

  <div class="result-box">
    <span id="result">—</span>
  </div>

  <h2>计算历史 <button onclick="clearAllHistory()">清空全部</button></h2>
  <ul id="historyList"><li>暂无记录</li></ul>

  <div class="pagination">
    <button id="prevBtn" onclick="prevPage()">上一页</button>
    <span id="pageInfo">第 1 页</span>
    <button id="nextBtn" onclick="nextPage()">下一页</button>
  </div>
</div>

<script>
const API_BASE = 'https://eight32401123-calculator-backend-1.onrender.com';
const PAGE_SIZE = 5;

const expressionInput = document.getElementById('expression');
const calcBtn = document.getElementById('calcBtn');
const resultSpan = document.getElementById('result');
const historyList = document.getElementById('historyList');
const pageInfo = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const themeBtn = document.getElementById('themeBtn');

let allHistory = [];
let currentPage = 1;

function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeBtn.textContent = isDark ? '☀️ 切换主题' : '🌙 切换主题';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.body.classList.add('dark');
    themeBtn.textContent = '☀️ 切换主题';
  }
}

function append(char) {
  const start = expressionInput.selectionStart;
  const end = expressionInput.selectionEnd;
  const value = expressionInput.value;
  expressionInput.value = value.slice(0, start) + char + value.slice(end);
  const pos = start + char.length;
  expressionInput.setSelectionRange(pos, pos);
  expressionInput.focus();
}

function appendFunc(text) {
  const start = expressionInput.selectionStart;
  const end = expressionInput.selectionEnd;
  const value = expressionInput.value;
  const insert = text + ')';
  expressionInput.value = value.slice(0, start) + insert + value.slice(end);
  const pos = start + insert.length - 1;
  expressionInput.setSelectionRange(pos, pos);
  expressionInput.focus();
}

function clearInput() {
  expressionInput.value = '';
  expressionInput.focus();
}

async function calculate() {
  const expression = expressionInput.value.trim();
  if (!expression) return;
  calcBtn.disabled = true;
  calcBtn.textContent = '计算中...';
  try {
    const response = await fetch(`${API_BASE}/api/calculate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ expression })
    });
    const data = await response.json();
    if (data.success) {
      resultSpan.textContent = data.result;
      currentPage = 1;
      await loadHistory();
    } else {
      resultSpan.textContent = data.message;
    }
  } catch (error) {
    resultSpan.textContent = '无法连接后端服务，请确认后端已启动';
  } finally {
    calcBtn.disabled = false;
    calcBtn.textContent = '计算';
  }
}

async function loadHistory() {
  try {
    const response = await fetch(`${API_BASE}/api/history`);
    const data = await response.json();
    if (!data.success || !data.history) {
      allHistory = [];
    } else {
      allHistory = data.history;
    }
    renderHistory();
  } catch (error) {
    historyList.innerHTML = '<li>历史记录加载失败</li>';
    pageInfo.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
  }
}

function renderHistory() {
  if (allHistory.length === 0) {
    historyList.innerHTML = '<li>暂无记录</li>';
    pageInfo.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  const totalPages = Math.ceil(allHistory.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = allHistory.slice(start, start + PAGE_SIZE);

  historyList.innerHTML = pageItems.map(item => `
    <li>
      ${escapeHtml(item.expression)} = ${item.result}
      <span>${formatTime(item.created_at)}</span>
      <button onclick="deleteRecord(${item.id})">删除</button>
    </li>`).join('');

  pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderHistory();
  }
}

function nextPage() {
  const totalPages = Math.ceil(allHistory.length / PAGE_SIZE);
  if (currentPage < totalPages) {
    currentPage++;
    renderHistory();
  }
}

async function deleteRecord(id) {
  try {
    const response = await fetch(`${API_BASE}/api/history/${id}`, { method: 'DELETE' });
    const data = await response.json();
    if (data.success) { await loadHistory(); }
    else { alert('删除失败：' + data.message); }
  } catch (error) {
    alert('无法连接后端服务');
  }
}

async function clearAllHistory() {
  if (!confirm('确定要清空所有历史记录吗？')) return;
  try {
    const response = await fetch(`${API_BASE}/api/history`, { method: 'DELETE' });
    const data = await response.json();
    if (data.success) {
      currentPage = 1;
      await loadHistory();
    } else {
      alert('清空失败：' + data.message);
    }
  } catch (error) {
    alert('无法连接后端服务');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(timeStr) {
  return timeStr ? timeStr.slice(5, 16) : '';
}

calcBtn.addEventListener('click', calculate);
expressionInput.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });

initTheme();
loadHistory();
</script>

</body>
</html>
